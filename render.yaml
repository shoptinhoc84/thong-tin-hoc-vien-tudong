services:
  - type: web
    name: cccd-hoc-vien
    runtime: python
    buildCommand: "apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-vie && pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/students.db
    disk:
      name: cccd-hoc-vien-data
      mountPath: /var/data
      sizeGB: 1
